  <script>
/**
 * Server 2355 Calendar - Main Application Logic
 * 處理視圖渲染、互動、資源管理、本地儲存
 */

// 全域狀態
let currentView = 'month';
let currentMonth = new Date('2025-09-01'); // 從 9 月開始
let currentWeekIndex = 1; // Week 2 (09/21-09/27) 為預設核心週
let resourceBudget = { ...DEFAULT_RESOURCE_BUDGET };
let selectedDayData = null;

// DOM 元素快取
const els = {
  monthView: document.getElementById('month-view'),
  weekView: document.getElementById('week-view'),
  monthGrid: document.getElementById('month-grid'),
  monthTitle: document.getElementById('month-title'),
  weekGrid: document.getElementById('week-grid'),
  weekHeaderCells: [],
  viewMonthBtn: document.getElementById('view-month'),
  viewWeekBtn: document.getElementById('view-week'),
  prevMonthBtn: document.getElementById('prev-month'),
  nextMonthBtn: document.getElementById('next-month'),
  todayBtn: document.getElementById('today-btn'),
  themeToggle: document.getElementById('theme-toggle'),
  themeIcon: document.getElementById('theme-icon'),
  resourcePanelBtn: document.getElementById('resource-panel-btn'),
  resourcePanel: document.getElementById('resource-panel'),
  closeResourcePanel: document.getElementById('close-resource-panel'),
  resourceInputs: document.getElementById('resource-inputs'),
  resetResourcesBtn: document.getElementById('reset-resources'),
  saveResourcesBtn: document.getElementById('save-resources'),
  exportBtn: document.getElementById('export-btn'),
  printBtn: document.getElementById('print-btn'),
  modalOverlay: document.getElementById('modal-overlay'),
  modal: document.getElementById('modal'),
  modalClose: document.getElementById('modal-close'),
  modalIcon: document.getElementById('modal-icon'),
  modalEventName: document.getElementById('modal-event-name'),
  modalServerDay: document.getElementById('modal-server-day'),
  modalBody: document.getElementById('modal-body'),
  legend: document.getElementById('legend'),
  syncStatus: document.getElementById('sync-status')
};

// 初始化
document.addEventListener('DOMContentLoaded', () => {
  loadResourceBudget();
  renderLegend();
  renderResourceInputs();
  syncResourcePanel();
  initEventListeners();
  updateView();
  updateWeekHeader();
  detectTodayWeek();
});

// 事件監聽器
function initEventListeners() {
  // 視圖切換
  els.viewMonthBtn.addEventListener('click', () => switchView('month'));
  els.viewWeekBtn.addEventListener('click', () => switchView('week'));

  // 月曆導航
  els.prevMonthBtn.addEventListener('click', () => navigateMonth(-1));
  els.nextMonthBtn.addEventListener('click', () => navigateMonth(1));
  els.todayBtn.addEventListener('click', () => goToToday());

  // 主題切換
  els.themeToggle.addEventListener('click', toggleTheme);

  // 資源面板
  els.resourcePanelBtn.addEventListener('click', () => toggleResourcePanel(true));
  els.closeResourcePanel.addEventListener('click', () => toggleResourcePanel(false));
  els.resetResourcesBtn.addEventListener('click', resetResources);
  els.saveResourcesBtn.addEventListener('click', saveResources);

  // 匯出/列印
  els.exportBtn.addEventListener('click', exportCSV);
  els.printBtn.addEventListener('click', () => window.print());

  // Modal
  els.modalClose.addEventListener('click', closeModal);
  els.modalOverlay.addEventListener('click', (e) => {
    if (e.target === els.modalOverlay) closeModal();
  });

  // 鍵盤快捷鍵
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'ArrowLeft' && currentView === 'month') navigateMonth(-1);
    if (e.key === 'ArrowRight' && currentView === 'month') navigateMonth(1);
    if (e.key === 'ArrowUp' && currentView === 'week') navigateWeek(-1);
    if (e.key === 'ArrowDown' && currentView === 'week') navigateWeek(1);
    if (e.key === 't' || e.key === 'T') goToToday();
    if (e.key === 'r' || e.key === 'R') toggleResourcePanel(true);
  });

  // 點擊外部關閉 resource panel
  document.addEventListener('click', (e) => {
    if (!els.resourcePanel.contains(e.target) && !els.resourcePanelBtn.contains(e.target)) {
      toggleResourcePanel(false);
    }
  });
}

// ========== 視圖管理 ==========
function switchView(view) {
  currentView = view;
  els.monthView.style.display = view === 'month' ? 'block' : 'none';
  els.weekView.style.display = view === 'week' ? 'block' : 'none';
  els.viewMonthBtn.classList.toggle('active', view === 'month');
  els.viewMonthBtn.setAttribute('aria-selected', view === 'month');
  els.viewWeekBtn.classList.toggle('active', view === 'week');
  els.viewWeekBtn.setAttribute('aria-selected', view === 'week');
  updateView();
}

function updateView() {
  if (currentView === 'month') {
    renderMonthView();
  } else {
    renderWeekView();
  }
}

function navigateMonth(delta) {
  currentMonth.setMonth(currentMonth.getMonth() + delta);
  renderMonthView();
}

function navigateWeek(delta) {
  currentWeekIndex = Math.max(0, Math.min(WEEKS_DATA.length - 1, currentWeekIndex + delta));
  renderWeekView();
  updateWeekHeader();
}

function goToToday() {
  const today = new Date().toISOString().split('T')[0];
  const dayData = getDayByDate(today);
  if (dayData) {
    // 切換到包含今天的週
    for (let i = 0; i < WEEKS_DATA.length; i++) {
      if (today >= WEEKS_DATA[i].startDate && today <= WEEKS_DATA[i].endDate) {
        currentWeekIndex = i;
        break;
      }
    }
    switchView('week');
    renderWeekView();
    updateWeekHeader();
    // 滾動到今天的欄位
    setTimeout(() => scrollToTodayColumn(), 100);
  } else {
    // 如果今天不在資料範圍，切換到月視圖並跳轉到今天所在月
    currentMonth = new Date(today);
    currentMonth.setDate(1);
    switchView('month');
    renderMonthView();
  }
}

function detectTodayWeek() {
  const today = new Date().toISOString().split('T')[0];
  for (let i = 0; i < WEEKS_DATA.length; i++) {
    if (today >= WEEKS_DATA[i].startDate && today <= WEEKS_DATA[i].endDate) {
      currentWeekIndex = i;
      break;
    }
  }
}

function scrollToTodayColumn() {
  const today = new Date().toISOString().split('T')[0];
  const dayIndex = new Date(today).getDay(); // 0=Sun, 1=Mon...
  const colIndex = dayIndex === 0 ? 6 : dayIndex - 1; // 轉換為 0=Mon...6=Sun
  const column = document.querySelectorAll('.week-day-column')[colIndex];
  if (column) {
    column.scrollIntoView({ behavior: 'smooth', inline: 'center' });
  }
}

// ========== 月曆渲染 ==========
function renderMonthView() {
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();

  // 更新標題
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  els.monthTitle.textContent = `${year}年 ${monthNames[month]}`;

  // 計算第一天是週幾 (0=Sun, 1=Mon...)
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startDayOfWeek = firstDay.getDay(); // 0=Sun
  const daysInMonth = lastDay.getDate();

  // 轉換為 0=Mon 起始
  const startOffset = startDayOfWeek === 0 ? 6 : startDayOfWeek - 1;

  // 上個月尾巴
  const prevMonthLastDay = new Date(year, month, 0).getDate();

  let html = '';

  // 填充上個月
  for (let i = startOffset - 1; i >= 0; i--) {
    const day = prevMonthLastDay - i;
    const date = new Date(year, month - 1, day);
    const dateStr = date.toISOString().split('T')[0];
    html += renderMonthDayCell(dateStr, day, true);
  }

  // 當月
  for (let day = 1; day <= daysInMonth; day++) {
    const date = new Date(year, month, day);
    const dateStr = date.toISOString().split('T')[0];
    html += renderMonthDayCell(dateStr, day, false);
  }

  // 下個月開頭 (補滿 6 週 = 42 格)
  const totalCells = startOffset + daysInMonth;
  const nextMonthDays = Math.ceil(totalCells / 7) * 7 - totalCells;
  for (let day = 1; day <= nextMonthDays; day++) {
    const date = new Date(year, month + 1, day);
    const dateStr = date.toISOString().split('T')[0];
    html += renderMonthDayCell(dateStr, day, true);
  }

  els.monthGrid.innerHTML = html;

  // 綁定點擊事件
  document.querySelectorAll('.month-day:not(.empty)').forEach(cell => {
    cell.addEventListener('click', () => openModal(cell.dataset.date));
  });
}

function renderMonthDayCell(dateStr, dayNum, isOtherMonth) {
  const dayData = getDayByDate(dateStr);
  const today = new Date().toISOString().split('T')[0];
  const isToday = dateStr === today;
  const isEmpty = !dayData && isOtherMonth;

  if (isEmpty) {
    return `<div class="month-day empty" data-date="${dateStr}"><div class="day-number">${dayNum}</div></div>`;
  }

  let classes = 'month-day';
  if (isToday) classes += ' today';
  if (dayData?.strongestLordDay) classes += ' strongest-lord';

  let eventsHtml = '';
  if (dayData && dayData.events.length > 0) {
    const displayEvents = dayData.events.slice(0, 4);
    eventsHtml = displayEvents.map(ev => {
      const info = getEventTypeInfo(ev.id);
      return `<span class="event-chip" style="background: ${info.color}22; color: ${info.color}; border: 1px solid ${info.color}44;">
        <span class="icon">${info.icon}</span>${info.label}${ev.day ? ` D${ev.day}` : ''}
      </span>`;
    }).join('');
    if (dayData.events.length > 4) {
      eventsHtml += `<span class="more-events">+${dayData.events.length - 4} 個</span>`;
    }
  }

  let slBadge = '';
  if (dayData?.strongestLordDay) {
    slBadge = `<span class="sl-badge">SL Day ${dayData.strongestLordDay}</span>`;
  }

  const serverDayBadge = dayData ? `<span class="server-day-badge">Day ${dayData.serverDay}</span>` : '';

  return `
    <div class="${classes}" data-date="${dateStr}" role="gridcell" tabindex="0" aria-label="${dateStr}${dayData ? ' · ' + dayData.events.map(e => getEventTypeInfo(e.id).label).join(', ') : ''}">
      <div class="day-number">${dayNum}${serverDayBadge}</div>
      ${slBadge}
      <div class="day-events">${eventsHtml}</div>
    </div>
  `;
}

// ========== 週曆渲染 ==========
function renderWeekView() {
  const week = WEEKS_DATA[currentWeekIndex];
  if (!week) return;

  // 更新週標題列
  week.days.forEach((day, idx) => {
    const headerCell = document.getElementById(`wh-${idx}`);
    if (headerCell) {
      const date = new Date(day.date);
      const weekdayNames = ['一','二','三','四','五','六','日'];
      headerCell.innerHTML = `
        <div class="week-day-date">${date.getDate()}</div>
        <div class="week-day-server">Day ${day.serverDay}</div>
        ${day.isToday ? '<span style="color:var(--today-ring);font-size:0.7rem;">● 今日</span>' : ''}
        ${day.strongestLordDay ? `<span class="sl-badge" style="margin-top:4px;">SL Day ${day.strongestLordDay}</span>` : ''}
      `;
      headerCell.className = 'week-header-cell';
      if (day.isToday) headerCell.classList.add('today');
      if (day.strongestLordDay) headerCell.classList.add('strongest-lord');
    }
  });

  // 渲染時間軸 + 事件欄
  const timeSlots = [
    '00:00-04:00', '04:00-08:00', '08:00-12:00',
    '12:00-16:00', '16:00-20:00', '20:00-24:00'
  ];

  let html = '';
  timeSlots.forEach((slot, slotIdx) => {
    html += `<div class="time-label" style="--slot-index:${slotIdx};">${slot}</div>`;
    week.days.forEach((day, dayIdx) => {
      const isFirstSlot = slotIdx === 0;
      const colClass = `week-day-column${day.isToday ? ' today' : ''}${day.strongestLordDay ? ' strongest-lord' : ''}`;
      const headerHtml = isFirstSlot ? `
        <div class="week-day-header${day.isToday ? ' today' : ''}${day.strongestLordDay ? ' strongest-lord' : ''}">
          <div class="week-day-date">${new Date(day.date).getDate()}</div>
          <div class="week-day-server">Day ${day.serverDay}</div>
          ${day.isToday ? '<span style="color:var(--today-ring);font-size:0.65rem;">● 今日</span>' : ''}
          ${day.strongestLordDay ? `<span class="sl-badge" style="margin-top:4px;">SL Day ${day.strongestLordDay}</span>` : ''}
        </div>
      ` : '';

      let eventsHtml = '';
      if (day.events.length > 0) {
        eventsHtml = day.events.map(ev => renderWeekEventCard(ev, day)).join('');
      }

      // 強勢領主每日任務
      let slTasksHtml = '';
      if (day.strongestLordDay) {
        const slInfo = getStrongestLordDayInfo(day.strongestLordDay);
        if (slInfo) {
          slTasksHtml = slInfo.mainTasks.map(task => `
            <div class="week-task ${task.must ? 'must' : 'should'}">
              <span class="week-task-icon">${task.must ? '🔴' : '🟡'}</span>
              <div class="week-task-text">${task.task}</div>
              ${task.score ? `<span class="week-task-score">${task.score}</span>` : ''}
            </div>
          `).join('');
        }
      }

      html += `
        <div class="${colClass}" data-date="${day.date}" data-day-index="${dayIdx}">
          ${headerHtml}
          <div class="week-day-events">
            ${eventsHtml}
            ${slTasksHtml}
            ${day.notes ? `<div class="week-day-notes"><strong>備註：</strong>${day.notes}</div>` : ''}
          </div>
        </div>
      `;
    });
  });

  els.weekGrid.innerHTML = html;

  // 綁定事件卡片點擊
  document.querySelectorAll('.week-event-card').forEach(card => {
    card.addEventListener('click', (e) => {
      e.stopPropagation();
      const date = card.closest('.week-day-column').dataset.date;
      const eventId = card.dataset.eventId;
      openModal(date, eventId);
    });
  });

  // 綁定 SL 任務點擊
  document.querySelectorAll('.week-task').forEach(task => {
    task.addEventListener('click', (e) => {
      e.stopPropagation();
      const date = task.closest('.week-day-column').dataset.date;
      openModal(date, 'strongest-lord');
    });
  });

  // 綁定日期欄點擊（開啟當日總覽）
  document.querySelectorAll('.week-day-header').forEach(header => {
    header.addEventListener('click', (e) => {
      if (e.target.closest('.sl-badge')) return;
      const date = header.closest('.week-day-column').dataset.date;
      openModal(date);
    });
  });
}

function renderWeekEventCard(ev, dayData) {
  const info = getEventTypeInfo(ev.id);
  const isSL = ev.id === 'strongest-lord' || ev.id === 'strongest-governor' || ev.id === 'governor-gear-enhancement';
  return `
    <div class="week-event-card${isSL ? ' strongest-lord' : ''}" data-event-id="${ev.id}" data-date="${dayData.date}" tabindex="0" role="button" aria-label="${info.label} 第 ${ev.day} 天">
      <div class="week-event-header">
        <span class="week-event-icon">${info.icon}</span>
        <span class="week-event-name">${info.label}${ev.day ? ` 第 ${ev.day} 天` : ''}</span>
        <span class="week-event-day">優先級 ${info.priority}</span>
      </div>
    </div>
  `;
}

function updateWeekHeader() {
  const week = WEEKS_DATA[currentWeekIndex];
  if (week) {
    // 更新週視圖的標題資訊（可在 header 顯示）
  }
}

// ========== 圖例渲染 ==========
function renderLegend() {
  // 收集所有在資料中出現的事件類型
  const usedTypes = new Set();
  WEEKS_DATA.forEach(week => {
    week.days.forEach(day => {
      day.events.forEach(ev => usedTypes.add(ev.id));
      if (day.strongestLordDay) usedTypes.add('strongest-lord');
    });
  });

  // 按優先級排序
  const sortedTypes = Array.from(usedTypes).sort((a, b) => {
    const pa = EVENT_TYPES[a]?.priority || 99;
    const pb = EVENT_TYPES[b]?.priority || 99;
    return pa - pb;
  });

  els.legend.innerHTML = sortedTypes.map(type => {
    const info = getEventTypeInfo(type);
    return `
      <span class="legend-item" style="background: ${info.color}22; color: ${info.color}; border: 1px solid ${info.color}44;">
        <span class="legend-dot" style="background: ${info.color};"></span>
        ${info.icon} ${info.label}
      </span>
    `;

// ========== 資源面板 ==========
function renderResourceInputs() {
  const fields = [
    { key: 'spinCoins', label: '轉盤幣/幸運幣', icon: '🎯', type: 'number', min: 0 },
    { key: 'legendaryTokens', label: '傳說英雄信物', icon: '⭐', type: 'number', min: 0 },
    { key: 'epicTokens', label: '史詩英雄信物', icon: '🌟', type: 'number', min: 0 },
    { key: 'rareTokens', label: '稀有英雄信物', icon: '✨', type: 'number', min: 0 },
    { key: 'advancedTamingMarks', label: '高級馴化印記 (🔴禁用)', icon: '🐾', type: 'number', min: 0 },
    { key: 'normalTamingMarks', label: '普通馴化印記', icon: '🍃', type: 'number', min: 0 },
    { key: 'heroExclusiveParts', label: '英雄專屬裝備組件', icon: '⚙️', type: 'number', min: 0 },
    { key: 'heroForgeHammers', label: '英雄裝備鍛造錘', icon: '🔨', type: 'number', min: 0 },
    { key: 'mithril', label: '秘銀 (萬)', icon: '💠', type: 'number', min: 0, step: 0.1 },
    { key: 'speedups', label: '加速道具 (萬分鐘)', icon: '⚡', type: 'number', min: 0, step: 0.1 },
    { key: 'diamonds', label: '鑽石 (萬)', icon: '💎', type: 'number', min: 0, step: 0.1 }
  ];

  els.resourceInputs.innerHTML = fields.map(f => `
    <div class="resource-input-group">
      <label class="resource-input-label">
        <span>${f.icon} ${f.label}</span>
      </label>
      <input type="${f.type}" class="resource-input" id="res-${f.key}" 
        value="${resourceBudget[f.key] || ''}" min="${f.min || 0}" step="${f.step || 1}"
        placeholder="點擊輸入" aria-label="${f.label}">
    </div>
  `).join('');

  // 綁定輸入事件
  fields.forEach(f => {
    const input = document.getElementById(`res-${f.key}`);
    if (input) {
      input.addEventListener('change', () => {
        resourceBudget[f.key] = f.type === 'number' && f.step ? parseFloat(input.value) || 0 : parseInt(input.value) || 0;
        syncResourcePanel();
      });
    }
  });
}

function toggleResourcePanel(open) {
  els.resourcePanel.classList.toggle('open', open);
  els.resourcePanel.setAttribute('aria-hidden', !open);
  if (open) {
    els.syncStatus.textContent = '💾 本地儲存 · 自動同步';
  }
}

function syncResourcePanel() {
  // 更新同步狀態顯示
  const hasData = Object.values(resourceBudget).some(v => v > 0);
  els.syncStatus.textContent = hasData ? '✅ 已載入自訂資源 · 本地儲存' : '💾 使用預設值 · 點擊編輯';
}

function loadResourceBudget() {
  try {
    const saved = localStorage.getItem('server2355-resource-budget');
    if (saved) {
      resourceBudget = { ...DEFAULT_RESOURCE_BUDGET, ...JSON.parse(saved) };
    }
  } catch (e) {
    console.warn('載入資源預算失敗:', e);
  }
}

function saveResources() {
  try {
    localStorage.setItem('server2355-resource-budget', JSON.stringify(resourceBudget));
    els.syncStatus.textContent = '✅ 已儲存至本地';
    setTimeout(() => syncResourcePanel(), 2000);
    toggleResourcePanel(false);
    // 重新渲染 modal 以更新資源顯示
    if (selectedDayData) {
      openModal(selectedDayData.date);
    }
  } catch (e) {
    console.error('儲存失敗:', e);
    els.syncStatus.textContent = '❌ 儲存失敗';
  }
}

function resetResources() {
  resourceBudget = { ...DEFAULT_RESOURCE_BUDGET };
  renderResourceInputs();
  syncResourcePanel();
  saveResources();
}

// ========== 匯出 CSV ==========
function exportCSV() {
  const rows = [
    ['Date (UTC)', 'Server Day', 'Week', 'Events', 'Strongest Lord Day', 'Must Do', 'Should Do', 'Skip', 'Key Resources Spend', 'Key Resources Save', 'Notes']
  ];

  WEEKS_DATA.forEach(week => {
    week.days.forEach(day => {
      const eventsStr = day.events.map(ev => {
        const info = getEventTypeInfo(ev.id);
        return `${info.label}${ev.day ? ` D${ev.day}` : ''}`;
      }).join(' | ');

      let mustDo = '', shouldDo = '', skip = '', spend = '', save = '';
      if (day.strongestLordDay) {
        const slInfo = getStrongestLordDayInfo(day.strongestLordDay);
        if (slInfo) {
          mustDo = slInfo.mainTasks.filter(t => t.must).map(t => t.task).join('; ');
          shouldDo = slInfo.mainTasks.filter(t => !t.must).map(t => t.task).join('; ');
          spend = slInfo.keyResources.join('; ');
          save = slInfo.saveResources.join('; ');
        }
      }

      rows.push([
        day.date,
        day.serverDay,
        week.label,
        eventsStr,
        day.strongestLordDay ? `Day ${day.strongestLordDay} ${getStrongestLordDayInfo(day.strongestLordDay)?.theme || ''}` : '',
        mustDo,
        shouldDo,
        skip,
        spend,
        save,
        day.notes || ''
      ]);
    });
  });

  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `server-2355-calendar-${new Date().toISOString().split('T')[0]}.csv`;
  link.click();
  URL.revokeObjectURL(link.href);
}

(function loadTheme() {
  const saved = localStorage.getItem('server2355-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  els.themeIcon.textContent = theme === 'dark' ? '☀️' : '🌙';
})();
